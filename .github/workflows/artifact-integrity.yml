name: Artifact byte integrity (nonclinical)
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify archived Reader and Atlas SHA-256
        run: python3 scripts/verify_artifacts.py
